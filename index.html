<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa</title>
</head>

<body>
    <header>
        <h1>Pesquisa IBGE</h1>
    </header>
    <section>
        <fieldset>
            <legend>Dados Pessoais</legend>
            <form action="" method="get">
                <!-- DADOS PESSOAIS -->
                <label for="userName">Nome</label>
                <input type="text" name="userName" required>
                <br />

                <label for="userAge">Idade</label>
                <input type="number" name="userAge" min="10" max="100" required>
                <br />

                <label for="birthDate">Data de nascimento</label>
                <input type="date" name="birthDate">
                <br />

                <label for="userEmail">Email</label>
                <input type="email" name="userEmail" required>
                <br />

                <label for="userPhoneNumber">Telefone</label>
                <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="Digite seu número">
                <br />

                <label for="Img">Escolha uma imagem</label>
                <input type="file" accept="image/*" name="userImage">

                <button>Confirmar</button>
            </form>
        </fieldset>

        <fieldset>
            <legend>Perfil</legend>
            <p>Gênero</p>

            <input type="radio" value="feminino" name="userGender" id="femGender">
            <label for="femGender">Feminino</label>

            <input type="radio" name="userGender" value="masculino" id="masGender">
            <label for="masGender">masculino</label>

            <input type="radio" value="trans" name="userGender" id="traGender">
            <label for="traGender">Trans</label>

            <input type="radio" value="homosexual" name="userGender" id="homoGender">
            <label for="homoGender">Homosexual</label>
        </fieldset>

    </section>
</body>

</html>
